<script>
(function () {
  const dniLength = Number(<?= CONFIG.VALIDATION.DNI_LENGTH ?>);
  const movilLength = Number(<?= CONFIG.VALIDATION.MOVIL_LENGTH ?>);
  const dniAutoBusquedaDelayMs = 350;
  const allowedEmailDomains = <?!= JSON.stringify(CONFIG.VALIDATION.CORREO_DOMINIOS_PERMITIDOS || []) ?>;
  const sinCorreoText = <?!= JSON.stringify(CONFIG.VALIDATION.CORREO_SIN_CORPORATIVO || 'Sin correo') ?>;
  const allowedEmailDomainsLabel = allowedEmailDomains.join(', ');

  const el = {
    dni: document.getElementById('dni'),
    btnBuscarDni: document.getElementById('btnBuscarDni'),
    dniAyuda: document.getElementById('dniAyuda'),
    nombreCompleto: document.getElementById('nombreCompleto'),
    cargo: document.getElementById('cargo'),
    movil: document.getElementById('movil'),
    correoElectronico: document.getElementById('correoElectronico'),
    sinCorreoCorporativo: document.getElementById('sinCorreoCorporativo'),
    proyectoSede: document.getElementById('proyectoSede'),
    empresaDelGrupo: document.getElementById('empresaDelGrupo'),
    centroCosto: document.getElementById('centroCosto'),
    cecoNumero: document.getElementById('cecoNumero'),
    tipoEquipo: document.getElementById('tipoEquipo'),
    activoSeleccionadoId: document.getElementById('activoSeleccionadoId'),
    activoAfectado: document.getElementById('activoAfectado'),
    activoGrid: document.getElementById('activoGrid'),
    activoAyuda: document.getElementById('activoAyuda'),
    tipoProblema: document.getElementById('tipoProblema'),
    tipoProblemaAyuda: document.getElementById('tipoProblemaAyuda'),
    prioridad: document.getElementById('prioridad'),
    descripcion: document.getElementById('descripcion'),
    btnVerSla: document.getElementById('btnVerSla'),
    slaModal: document.getElementById('slaModal'),
    btnCerrarSla: document.getElementById('btnCerrarSla'),
    slaTipoProblemaActual: document.getElementById('slaTipoProblemaActual'),
    slaPrioridadActual: document.getElementById('slaPrioridadActual'),
    slaTiempoActual: document.getElementById('slaTiempoActual'),
    slaLista: document.getElementById('slaLista'),
    anydeskBox: document.getElementById('anydeskBox'),
    anydeskId: document.getElementById('anydeskId'),
    anydeskPassword: document.getElementById('anydeskPassword'),
    btnEnviar: document.getElementById('btnEnviar'),
    btnNuevoReporte: document.getElementById('btnNuevoReporte'),
    ticketId: document.getElementById('ticketId'),
    formProgressFill: document.getElementById('formProgressFill'),
    formProgressTexto: document.getElementById('formProgressTexto')
  };

  let dniAutoBusquedaTimer = null;
  let ultimoDniConsultado = '';
  let dniEnConsulta = '';
  let dniConsultaSecuencia = 0;
  let cecoConsultaSecuencia = 0;
  let activosConsultaSecuencia = 0;
  let cecoPreferido = null;
  let activosDisponibles = [];
  let catalogoTiposProblemaPorActivo = {};
  let ultimaClaveSlaAutoMostrada = '';
  const slaPorPrioridad = {
    Baja: {
      tiempo: 'Hasta 8 horas habiles',
      detalle: 'Incidencia de bajo impacto o con alternativa temporal de trabajo.'
    },
    Media: {
      tiempo: 'Hasta 4 horas habiles',
      detalle: 'Incidencia que afecta la continuidad normal de una actividad.'
    },
    Alta: {
      tiempo: 'Hasta 2 horas habiles',
      detalle: 'Incidencia critica que bloquea la operacion o afecta servicios clave.'
    }
  };

  function normalizarTextoNumerico(valor) {
    let texto = String(valor || '');
    try {
      texto = texto.normalize('NFKC');
    } catch (error) {
      // Continuar con el texto original si `normalize` no estuviera disponible.
    }

    let salida = '';
    for (let i = 0; i < texto.length; i++) {
      const codigo = texto.charCodeAt(i);
      if (codigo >= 48 && codigo <= 57) {
        salida += texto.charAt(i);
      } else if (codigo >= 65296 && codigo <= 65305) {
        salida += String(codigo - 65296);
      } else if (codigo >= 1632 && codigo <= 1641) {
        salida += String(codigo - 1632);
      } else if (codigo >= 1776 && codigo <= 1785) {
        salida += String(codigo - 1776);
      }
    }
    return salida;
  }

  function normalizarDni(valor) {
    return normalizarTextoNumerico(valor).slice(0, dniLength);
  }

  function normalizarMovil(valor) {
    return normalizarTextoNumerico(valor).slice(0, movilLength);
  }

  function normalizarClave(valor) {
    let texto = String(valor || '');
    try {
      texto = texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    } catch (error) {
      // Si el navegador no soporta normalize, seguimos comparando con el texto base.
    }
    return texto.toUpperCase().replace(/[^A-Z0-9]/g, '');
  }

  function normalizarCorreo(valor) {
    return String(valor || '').trim().toLowerCase();
  }

  function esCorreoValidoBasico(valor) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(normalizarCorreo(valor));
  }

  function esCorreoCorporativoPermitido(valor) {
    const correo = normalizarCorreo(valor);
    if (!esCorreoValidoBasico(correo)) return false;
    return allowedEmailDomains.some(function (dominio) {
      return correo.slice(-String(dominio || '').length) === String(dominio || '').toLowerCase();
    });
  }

  function actualizarEstadoCorreoCorporativo() {
    const sinCorreoCorporativo = !!el.sinCorreoCorporativo.checked;
    if (sinCorreoCorporativo) {
      el.correoElectronico.value = '';
    }
    el.correoElectronico.disabled = sinCorreoCorporativo;
    el.correoElectronico.classList.toggle('is-disabled', sinCorreoCorporativo);
    el.correoElectronico.placeholder = sinCorreoCorporativo ? sinCorreoText : 'Ej. nombre@empresa.com';
    actualizarProgreso();
  }

  function actualizarVisibilidadAnydesk() {
    el.anydeskBox.hidden = false;
  }

  function actualizarSlaModal() {
    const prioridad = el.prioridad.value || '';
    const tipoProblema = el.tipoProblema.value || '';
    const slaActual = slaPorPrioridad[prioridad] || null;

    el.slaTipoProblemaActual.textContent = tipoProblema || 'No seleccionado';
    el.slaPrioridadActual.textContent = prioridad || 'No seleccionada';
    el.slaTiempoActual.textContent = slaActual ? slaActual.tiempo : 'Selecciona una prioridad';
    el.slaLista.innerHTML = '';

    Object.keys(slaPorPrioridad).forEach(function (nivel) {
      const item = document.createElement('div');
      item.className = 'sla-item' + (nivel === prioridad ? ' is-active' : '');

      const texto = document.createElement('div');
      const label = document.createElement('span');
      label.className = 'sla-item-label';
      label.textContent = 'Prioridad';
      const nombre = document.createElement('strong');
      nombre.textContent = nivel;
      const detalle = document.createElement('div');
      detalle.className = 'sla-modal-copy';
      detalle.textContent = slaPorPrioridad[nivel].detalle;
      texto.appendChild(label);
      texto.appendChild(nombre);
      texto.appendChild(detalle);

      const tiempo = document.createElement('div');
      tiempo.className = 'sla-item-time';
      tiempo.textContent = slaPorPrioridad[nivel].tiempo;

      item.appendChild(texto);
      item.appendChild(tiempo);
      el.slaLista.appendChild(item);
    });
  }

  function abrirSlaModal() {
    actualizarSlaModal();
    el.slaModal.hidden = false;
    el.btnCerrarSla.focus();
  }

  function cerrarSlaModal() {
    el.slaModal.hidden = true;
    el.btnVerSla.focus();
  }

  function evaluarAperturaAutomaticaSla() {
    const tipoProblema = el.tipoProblema.value || '';
    const prioridad = el.prioridad.value || '';
    if (!tipoProblema || !prioridad) return;

    const clave = tipoProblema + '|' + prioridad;
    if (clave === ultimaClaveSlaAutoMostrada) return;

    ultimaClaveSlaAutoMostrada = clave;
    setTimeout(function () {
      if (el.tipoProblema.value && el.prioridad.value && el.slaModal.hidden) {
        abrirSlaModal();
      }
    }, 180);
  }

  function construirMensajeDniInvalido(valor) {
    return 'El DNI debe tener ' + dniLength + ' digitos.';
  }

  function sincronizarCamposNumericos() {
    el.dni.value = normalizarDni(el.dni.value);
    el.movil.value = normalizarMovil(el.movil.value);
  }

  function programarBusquedaDni(opciones) {
    if (dniAutoBusquedaTimer) {
      clearTimeout(dniAutoBusquedaTimer);
      dniAutoBusquedaTimer = null;
    }

    const configuracion = opciones || {};
    const delay = typeof configuracion.delayMs === 'number' ? configuracion.delayMs : dniAutoBusquedaDelayMs;
    dniAutoBusquedaTimer = setTimeout(function () {
      dniAutoBusquedaTimer = null;
      sincronizarCamposNumericos();
      buscarDni(el.dni.value, {
        forzar: !!configuracion.forzar,
        mostrarErrorLongitud: !!configuracion.mostrarErrorLongitud
      });
    }, delay);
  }

  function marcarAutocompletado(campo) {
    campo.classList.remove('autocompletado');
    void campo.offsetWidth;
    campo.classList.add('autocompletado');
  }

  function actualizarProgreso() {
    const correoCompleto = el.sinCorreoCorporativo.checked || esCorreoCorporativoPermitido(el.correoElectronico.value);
    const campos = [
      normalizarDni(el.dni.value).length === dniLength,
      normalizarMovil(el.movil.value).length === movilLength,
      !!el.nombreCompleto.value.trim(),
      !!el.cargo.value.trim(),
      correoCompleto,
      !!el.proyectoSede.value.trim(),
      !!el.empresaDelGrupo.value,
      !!el.centroCosto.value,
      !!el.activoSeleccionadoId.value.trim(),
      !!el.tipoProblema.value,
      !!el.descripcion.value.trim()
    ];

    const completos = campos.filter(Boolean).length;
    const porcentaje = Math.round((completos / campos.length) * 100);
    el.formProgressFill.style.width = porcentaje + '%';
    el.formProgressTexto.textContent = porcentaje + '%';
  }

  function obtenerActivoPorId(id) {
    return activosDisponibles.find(function (activo) {
      return String(activo.id || '') === String(id || '');
    }) || null;
  }

  function resolverClaveCatalogoTipoProblema(activo) {
    const assetKind = String(activo && activo.assetKind || '').toLowerCase();
    if (assetKind === 'printer' || assetKind === 'scanner') return 'printscan';
    if (assetKind === 'pc' || assetKind === 'smartphone' || assetKind === 'consulta' || assetKind === 'otro') return assetKind;
    return '';
  }

  function resolverOpcionesTipoProblemaPorActivo(activo) {
    const clave = resolverClaveCatalogoTipoProblema(activo);
    return ((catalogoTiposProblemaPorActivo && catalogoTiposProblemaPorActivo[clave]) || []).map(function (opcion) {
      return {
        value: opcion.value,
        label: opcion.label,
        category: opcion.category,
        examples: opcion.examples
      };
    });
  }

  function actualizarAyudaTipoProblema(activo, opciones) {
    const opcionesVisibles = opciones || resolverOpcionesTipoProblemaPorActivo(activo);
    const valorSeleccionado = el.tipoProblema.value || '';
    const opcionSeleccionada = opcionesVisibles.find(function (opcion) {
      return opcion.value === valorSeleccionado;
    }) || null;

    if (!activo) {
      el.tipoProblemaAyuda.textContent = 'Selecciona primero el activo afectado para ver las categorias aplicables.';
      return;
    }

    if (opcionSeleccionada && opcionSeleccionada.examples) {
      el.tipoProblemaAyuda.textContent = opcionSeleccionada.examples;
      return;
    }

    if (!opcionesVisibles.length) {
      el.tipoProblemaAyuda.textContent = 'No se encontraron categorias configuradas para este activo.';
      return;
    }

    el.tipoProblemaAyuda.textContent = 'Categorias para este activo: ' + opcionesVisibles.map(function (opcion) {
      return opcion.label;
    }).join(', ') + '.';
  }

  function resolverTipoEquipoDesdeActivo(activo) {
    const kind = String(activo && activo.assetKind || '').toLowerCase();
    if (kind === 'smartphone') return 'Smartphone';
    if (kind === 'printer') return 'Impresora';
    if (kind === 'scanner') return 'Escaner';
    if (kind === 'consulta') return 'Programas';
    if (kind === 'otro') return 'Otro';
    if (kind === 'pc') return 'PC-Portatil';
    return '';
  }

  function actualizarTipoProblemaPorActivo(activo) {
    const valorActual = el.tipoProblema.value || '';
    const opcionesPermitidas = resolverOpcionesTipoProblemaPorActivo(activo);
    const activoSeleccionado = !!activo;

    el.tipoProblema.disabled = !activoSeleccionado;
    llenarSelect(el.tipoProblema, opcionesPermitidas, activoSeleccionado ? 'Selecciona...' : 'Selecciona primero un activo...');

    const existeOpcion = opcionesPermitidas.some(function (opcion) {
      return opcion.value === valorActual;
    });

    el.tipoProblema.value = existeOpcion ? valorActual : '';
    actualizarAyudaTipoProblema(activo, opcionesPermitidas);

    if (!el.slaModal.hidden) actualizarSlaModal();
    evaluarAperturaAutomaticaSla();
  }

  function svgIconoActivo(iconKey) {
    if (iconKey === 'phone') {
      return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="7" y="2.75" width="10" height="18.5" rx="2.5" stroke="currentColor" stroke-width="1.9"/><circle cx="12" cy="17.75" r="1" fill="currentColor"/><path d="M10 5.75h4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
    }
    if (iconKey === 'printer') {
      return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M7 8.5V4.5h10v4" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><rect x="4" y="8.5" width="16" height="8" rx="2.2" stroke="currentColor" stroke-width="1.9"/><path d="M7 13.5h10v6H7z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><circle cx="17" cy="11.5" r="1" fill="currentColor"/></svg>';
    }
    if (iconKey === 'scanner') {
      return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 8.5h14a2 2 0 0 1 2 2v2.5H3V10.5a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.9"/><path d="M6 13.5h12v5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 18.5z" stroke="currentColor" stroke-width="1.9"/><path d="M8 5h8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M9 17h6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
    }
    if (iconKey === 'consulta') {
      return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.9"/><path d="M9.75 9.25a2.33 2.33 0 1 1 3.74 1.87c-.96.73-1.49 1.21-1.49 2.13" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="16.85" r="1" fill="currentColor"/></svg>';
    }
    if (iconKey === 'otro') {
      return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>';
    }
    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="12" rx="2.5" stroke="currentColor" stroke-width="1.9"/><path d="M9 19h6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
  }

  function activosVirtualesFallback() {
    return [
      {
        id: 'VIRTUAL|CONSULTA',
        label: 'Consulta',
        iconKey: 'consulta',
        assetKind: 'consulta',
        secondaryText: 'Usa esta opcion si tu incidente no corresponde a un equipo asignado.',
        isVirtual: true,
        canonicalLabel: 'Consulta'
      },
      {
        id: 'VIRTUAL|OTRO',
        label: 'Otros',
        iconKey: 'otro',
        assetKind: 'otro',
        secondaryText: 'Usa esta opcion si necesitas registrar un caso excepcional.',
        isVirtual: true,
        canonicalLabel: 'Otros'
      }
    ];
  }

  function limpiarActivos(texto) {
    activosConsultaSecuencia++;
    activosDisponibles = [];
    el.activoSeleccionadoId.value = '';
    el.activoAfectado.value = '';
    el.tipoEquipo.value = '';
    el.activoGrid.innerHTML = '';
    el.activoAyuda.textContent = texto || 'Ingresa tu DNI para cargar tus activos personales y los compartidos de tu CECO.';
    actualizarTipoProblemaPorActivo(null);
    actualizarProgreso();
  }

  function seleccionarActivo(id) {
    const activo = obtenerActivoPorId(id);
    el.activoSeleccionadoId.value = activo ? activo.id : '';
    el.activoAfectado.value = activo ? (activo.canonicalLabel || activo.label || '') : '';
    el.tipoEquipo.value = activo ? resolverTipoEquipoDesdeActivo(activo) : '';
    actualizarTipoProblemaPorActivo(activo);

    Array.prototype.forEach.call(el.activoGrid.querySelectorAll('.activo-card'), function (card) {
      card.classList.toggle('is-active', card.dataset.assetId === el.activoSeleccionadoId.value);
      card.setAttribute('aria-selected', card.dataset.assetId === el.activoSeleccionadoId.value ? 'true' : 'false');
    });

    actualizarProgreso();
  }

  function renderActivoCard(activo, container) {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'activo-card' + (activo.isVirtual ? ' is-virtual' : '');
    card.dataset.assetId = activo.id || '';
    card.setAttribute('role', 'option');
    card.setAttribute('aria-selected', 'false');

    const icon = document.createElement('span');
    icon.className = 'activo-card-icon';
    icon.setAttribute('aria-hidden', 'true');
    icon.innerHTML = svgIconoActivo(activo.iconKey);

    const copy = document.createElement('span');
    copy.className = 'activo-card-copy';

    const title = document.createElement('span');
    title.className = 'activo-card-title';
    title.textContent = activo.label || 'Activo';

    const meta = document.createElement('span');
    meta.className = 'activo-card-meta';
    meta.textContent = [activo.sourceLabel, activo.secondaryText].filter(function (valor, indice, lista) {
      return !!valor && lista.indexOf(valor) === indice;
    }).join(' - ');

    copy.appendChild(title);
    if (meta.textContent) copy.appendChild(meta);
    card.appendChild(icon);
    card.appendChild(copy);
    container.appendChild(card);
  }

  function renderActivoSection(config) {
    const activos = (config && config.activos) || [];
    if (!activos.length) return;

    const section = document.createElement('section');
    section.className = 'activo-section';

    const head = document.createElement('div');
    head.className = 'activo-section-head';

    const title = document.createElement('span');
    title.className = 'activo-section-title';
    title.textContent = config.title || 'Activos';
    head.appendChild(title);

    if (config.description) {
      const desc = document.createElement('span');
      desc.className = 'activo-section-desc';
      desc.textContent = config.description;
      head.appendChild(desc);
    }

    const list = document.createElement('div');
    list.className = 'activo-grid-list';
    activos.forEach(function (activo) {
      renderActivoCard(activo, list);
    });

    section.appendChild(head);
    section.appendChild(list);
    el.activoGrid.appendChild(section);
  }

  function resolverGruposActivos(payload) {
    if (Array.isArray(payload)) {
      const activos = payload.slice();
      return {
        activos: activos,
        personales: activos.filter(function (activo) { return activo.sourceType === 'personal'; }),
        ceco: activos.filter(function (activo) { return activo.sourceType === 'ceco' || activo.sourceType === 'personal_ceco'; }),
        generales: activos.filter(function (activo) { return !!activo.isVirtual; })
      };
    }

    const data = payload || {};
    const activos = Array.isArray(data.activos) ? data.activos.slice() : [];
    const personales = Array.isArray(data.activosPersonales) ? data.activosPersonales.slice() : [];
    const ceco = Array.isArray(data.activosCeco) ? data.activosCeco.slice() : [];
    const idsAgrupados = {};

    personales.forEach(function (activo) {
      if (activo && activo.id) idsAgrupados[activo.id] = true;
    });
    ceco.forEach(function (activo) {
      if (activo && activo.id) idsAgrupados[activo.id] = true;
    });

    const generales = activos.filter(function (activo) {
      return !idsAgrupados[activo.id] || !!activo.isVirtual;
    });

    return {
      activos: activos,
      personales: personales,
      ceco: ceco,
      generales: generales
    };
  }

  function renderActivos(activos, mensaje) {
    const grupos = resolverGruposActivos(activos);
    activosDisponibles = grupos.activos || [];
    el.activoSeleccionadoId.value = '';
    el.activoAfectado.value = '';
    el.activoGrid.innerHTML = '';
    el.activoAyuda.textContent = mensaje || 'Selecciona un activo afectado.';
    actualizarTipoProblemaPorActivo(null);

    renderActivoSection({
      title: 'Tus activos',
      description: 'Equipos o dispositivos asignados directamente a tu usuario.',
      activos: grupos.personales
    });
    renderActivoSection({
      title: 'Activos compartidos del CECO',
      description: 'Impresoras y escaneres compartidos del centro de costo al que perteneces.',
      activos: grupos.ceco
    });
    renderActivoSection({
      title: 'Opciones generales',
      description: 'Usa estas opciones si el incidente no corresponde a un activo listado arriba.',
      activos: grupos.generales
    });

    actualizarProgreso();
    return;

    activosDisponibles.forEach(function (activo) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'activo-card' + (activo.isVirtual ? ' is-virtual' : '');
      card.dataset.assetId = activo.id || '';
      card.setAttribute('role', 'option');
      card.setAttribute('aria-selected', 'false');

      const icon = document.createElement('span');
      icon.className = 'activo-card-icon';
      icon.setAttribute('aria-hidden', 'true');
      icon.innerHTML = svgIconoActivo(activo.iconKey);

      const copy = document.createElement('span');
      copy.className = 'activo-card-copy';

      const title = document.createElement('span');
      title.className = 'activo-card-title';
      title.textContent = activo.label || 'Activo';

      const meta = document.createElement('span');
      meta.className = 'activo-card-meta';
      meta.textContent = [activo.sourceLabel, activo.secondaryText].filter(function (valor, indice, lista) {
        return !!valor && lista.indexOf(valor) === indice;
      }).join(' · ');

      copy.appendChild(title);
      if (meta.textContent) copy.appendChild(meta);
      card.appendChild(icon);
      card.appendChild(copy);
      el.activoGrid.appendChild(card);
    });

    actualizarProgreso();
  }

  function cargarActivosPorDni(dni) {
    const requestId = ++activosConsultaSecuencia;
    activosDisponibles = [];
    el.activoSeleccionadoId.value = '';
    el.activoAfectado.value = '';
    el.activoGrid.innerHTML = '';
    el.activoAyuda.textContent = 'Cargando activos personales y compartidos del CECO...';
    actualizarProgreso();

    google.script.run
      .withSuccessHandler(function (res) {
        if (requestId !== activosConsultaSecuencia || normalizarDni(el.dni.value) !== dni) return;
        if (!res.ok) {
          renderActivos(activosVirtualesFallback(), res.message || 'No se pudo cargar el catalogo completo de activos. Puedes registrar Consulta u Otros.');
          toast(res.message || 'No se pudo cargar el catalogo de activos.', 'error');
          return;
        }
        renderActivos((res.result && res.result.activos) || [], res.message);
      })
      .withFailureHandler(function () {
        if (requestId !== activosConsultaSecuencia) return;
        renderActivos(activosVirtualesFallback(), 'No se pudo cargar el catalogo completo de activos. Puedes registrar Consulta u Otros.');
        toast('No se pudo cargar el catalogo de activos.', 'error');
      })
      .ReporteService_listarActivosPorDni({ dni: dni });
  }

  document.getElementById('view-form').addEventListener('input', actualizarProgreso);
  document.getElementById('view-form').addEventListener('change', actualizarProgreso);

  function llenarSelect(select, opciones, textoVacio) {
    select.innerHTML = '<option value="">' + textoVacio + '</option>';
    opciones.forEach(function (opcion) {
      const option = document.createElement('option');
      option.value = opcion.value;
      option.textContent = opcion.label;
      if (opcion.cecoNumero) option.dataset.cecoNumero = opcion.cecoNumero;
      if (opcion.proyecto) option.dataset.proyecto = opcion.proyecto;
      select.appendChild(option);
    });
  }

  function actualizarCecoNumeroDesdeSeleccion() {
    const opcion = el.centroCosto.options[el.centroCosto.selectedIndex];
    el.cecoNumero.value = opcion && opcion.dataset.cecoNumero ? opcion.dataset.cecoNumero : '';
  }

  function normalizarComparacion(valor) {
    return String(valor || '').trim().toUpperCase();
  }

  function seleccionarCentroCostoPreferido(centrosCosto, preferencia) {
    if (!preferencia) return;

    const numeroPreferido = normalizarComparacion(preferencia.cecoNumero);
    const nombrePreferido = normalizarComparacion(preferencia.cecoNombre);
    const encontrado = centrosCosto.find(function (c) {
      return (numeroPreferido && normalizarComparacion(c.cecoNumero) === numeroPreferido) ||
        (nombrePreferido && normalizarComparacion(c.centroCosto).indexOf(nombrePreferido) !== -1);
    });

    if (encontrado) {
      el.centroCosto.value = encontrado.centroCosto;
      actualizarCecoNumeroDesdeSeleccion();
      marcarAutocompletado(el.centroCosto);
      marcarAutocompletado(el.cecoNumero);
    } else if (preferencia.cecoNumero) {
      el.cecoNumero.value = preferencia.cecoNumero;
      marcarAutocompletado(el.cecoNumero);
    }
  }

  function cargarCatalogos() {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res.ok) {
          toast(res.message, 'error');
          return;
        }

        llenarSelect(el.tipoEquipo, res.result.tiposEquipo.map(function (v) {
          return { value: v, label: v };
        }), 'Selecciona...');

        catalogoTiposProblemaPorActivo = res.result.tiposProblemaPorActivo || {};
        actualizarTipoProblemaPorActivo(null);
        llenarSelect(el.prioridad, res.result.prioridades.map(function (v) {
          return { value: v, label: v };
        }), 'Selecciona...');

        llenarSelect(el.empresaDelGrupo, Object.keys(res.result.empresas).map(function (k) {
          return { value: res.result.empresas[k], label: res.result.empresas[k] };
        }), 'Selecciona...');
      })
      .withFailureHandler(function () {
        toast('No se pudo cargar el formulario. Recarga la pagina.', 'error');
      })
      .ReporteService_obtenerCatalogos();
  }

  function cargarCentrosCosto(empresa) {
    const requestId = ++cecoConsultaSecuencia;
    if (!empresa) {
      el.centroCosto.disabled = true;
      llenarSelect(el.centroCosto, [], 'Selecciona primero la empresa...');
      el.cecoNumero.value = '';
      return;
    }

    el.centroCosto.disabled = true;
    llenarSelect(el.centroCosto, [], 'Cargando...');
    el.cecoNumero.value = '';

    google.script.run
      .withSuccessHandler(function (res) {
        if (requestId !== cecoConsultaSecuencia) return;
        if (!res.ok) {
          el.centroCosto.disabled = true;
          llenarSelect(el.centroCosto, [], 'No se pudo cargar...');
          toast(res.message, 'error');
          return;
        }

        const centrosCosto = res.result.centrosCosto || [];
        if (!centrosCosto.length) {
          el.centroCosto.disabled = true;
          llenarSelect(el.centroCosto, [], 'No hay centros de costo disponibles...');
          el.cecoNumero.value = cecoPreferido && cecoPreferido.cecoNumero ? cecoPreferido.cecoNumero : '';
          toast('No se encontraron centros de costo activos para la empresa seleccionada.', 'info');
          return;
        }

        llenarSelect(el.centroCosto, centrosCosto.map(function (c) {
          return {
            value: c.centroCosto,
            label: c.centroCosto,
            cecoNumero: c.cecoNumero || c.ceco,
            proyecto: c.proyecto
          };
        }), 'Selecciona...');
        el.centroCosto.disabled = false;
        seleccionarCentroCostoPreferido(centrosCosto, cecoPreferido);
        cecoPreferido = null;
        actualizarProgreso();
      })
      .withFailureHandler(function () {
        if (requestId !== cecoConsultaSecuencia) return;
        el.centroCosto.disabled = true;
        llenarSelect(el.centroCosto, [], 'No se pudo cargar...');
        el.cecoNumero.value = cecoPreferido && cecoPreferido.cecoNumero ? cecoPreferido.cecoNumero : '';
        toast('No se pudo cargar el catalogo de centros de costo.', 'error');
      })
      .PadronService_listarCecoActivos(empresa);
  }

  function buscarDni(dni, opciones) {
    opciones = opciones || {};
    const forzar = !!opciones.forzar;
    const mostrarErrorLongitud = !!opciones.mostrarErrorLongitud;
    const reintentoLongitud = !!opciones.reintentoLongitud;
    dni = normalizarDni(dni);
    el.dni.value = dni;

    el.dniAyuda.textContent = '';
    el.dniAyuda.className = 'ayuda';

    if (dni.length !== dniLength) {
      if (forzar && !reintentoLongitud) {
        setTimeout(function () {
          sincronizarCamposNumericos();
          buscarDni(el.dni.value, {
            forzar: true,
            mostrarErrorLongitud: mostrarErrorLongitud,
            reintentoLongitud: true
          });
        }, 180);
        return;
      }

      if (mostrarErrorLongitud) {
        el.dniAyuda.textContent = construirMensajeDniInvalido(el.dni.value);
        el.dniAyuda.className = 'ayuda alerta alerta-warn';
      }
      return;
    }

    if (dniEnConsulta === dni) return;
    if (!forzar && ultimoDniConsultado === dni) return;

    const requestId = ++dniConsultaSecuencia;
    dniEnConsulta = dni;
    ultimoDniConsultado = dni;
    el.btnBuscarDni.disabled = true;
    el.btnBuscarDni.classList.add('is-loading');

    google.script.run
      .withSuccessHandler(function (res) {
        if (requestId !== dniConsultaSecuencia || normalizarDni(el.dni.value) !== dni) return;
        dniEnConsulta = '';
        el.btnBuscarDni.disabled = false;
        el.btnBuscarDni.classList.remove('is-loading');

        if (!res.ok) {
          limpiarActivos('No se pudieron cargar activos para este DNI.');
          el.dniAyuda.textContent = res.message;
          el.dniAyuda.className = 'ayuda alerta alerta-warn';
          return;
        }

        el.nombreCompleto.value = res.result.nombreCompleto || '';
        el.cargo.value = res.result.cargo || '';
        el.movil.value = normalizarMovil(res.result.movil || '');
        if (res.result.correoElectronico) {
          el.sinCorreoCorporativo.checked = false;
          actualizarEstadoCorreoCorporativo();
          el.correoElectronico.value = normalizarCorreo(res.result.correoElectronico);
        } else if (!el.sinCorreoCorporativo.checked) {
          el.correoElectronico.value = '';
        }
        el.proyectoSede.value = res.result.proyecto || '';
        el.empresaDelGrupo.value = res.result.empresa || '';
        el.cecoNumero.value = res.result.cecoNumero || '';
        cecoPreferido = {
          cecoNumero: res.result.cecoNumero || '',
          cecoNombre: res.result.cecoNombre || ''
        };
        [el.nombreCompleto, el.cargo, el.movil, el.correoElectronico, el.proyectoSede, el.empresaDelGrupo, el.cecoNumero].forEach(function (campo) {
          if (campo && campo.value) marcarAutocompletado(campo);
        });
        el.dniAyuda.textContent = res.result.fuenteCorreoElectronico === 'REGISTRO'
          ? 'Datos encontrados. El correo electronico se recupero del ultimo registro asociado a ese DNI.'
          : 'Datos encontrados en el padron. La metadata interna del trabajador se completo automaticamente.';
        el.dniAyuda.className = 'ayuda alerta alerta-ok';
        cargarCentrosCosto(el.empresaDelGrupo.value);
        cargarActivosPorDni(dni);
        actualizarProgreso();
      })
      .withFailureHandler(function () {
        if (requestId !== dniConsultaSecuencia) return;
        dniEnConsulta = '';
        el.btnBuscarDni.disabled = false;
        el.btnBuscarDni.classList.remove('is-loading');
        limpiarActivos('No se pudieron cargar activos para este DNI.');
        toast('Error de comunicacion con el servidor.', 'error');
      })
      .PadronService_buscarPorDni(dni);
  }

  el.dni.addEventListener('input', function () {
    el.dni.value = normalizarDni(el.dni.value);
    const dni = el.dni.value;

    if (dni.length < dniLength) {
      dniConsultaSecuencia++;
      ultimoDniConsultado = '';
      dniEnConsulta = '';
      el.btnBuscarDni.disabled = false;
      el.btnBuscarDni.classList.remove('is-loading');
      limpiarActivos('Ingresa tu DNI para cargar tus activos personales y compartidos de tu CECO.');
      if (el.dniAyuda.classList.contains('alerta')) {
        el.dniAyuda.textContent = '';
        el.dniAyuda.className = 'ayuda';
      }
      return;
    }

    programarBusquedaDni({ forzar: false, mostrarErrorLongitud: false, delayMs: dniAutoBusquedaDelayMs });
  });

  el.dni.addEventListener('change', function () {
    sincronizarCamposNumericos();
    if (el.dni.value.length === dniLength) {
      programarBusquedaDni({ forzar: false, mostrarErrorLongitud: false, delayMs: 0 });
    }
  });

  el.dni.addEventListener('blur', function () {
    sincronizarCamposNumericos();
    if (el.dni.value.length === dniLength) {
      programarBusquedaDni({ forzar: false, mostrarErrorLongitud: false, delayMs: 0 });
    }
  });

  el.dni.addEventListener('compositionend', function () {
    sincronizarCamposNumericos();
    if (el.dni.value.length === dniLength) {
      programarBusquedaDni({ forzar: false, mostrarErrorLongitud: false, delayMs: 0 });
    }
  });

  el.movil.addEventListener('input', function () {
    el.movil.value = normalizarMovil(el.movil.value);
  });

  el.correoElectronico.addEventListener('input', function () {
    el.correoElectronico.value = normalizarCorreo(el.correoElectronico.value);
  });

  el.sinCorreoCorporativo.addEventListener('change', function () {
    actualizarEstadoCorreoCorporativo();
    if (!el.sinCorreoCorporativo.checked) el.correoElectronico.focus();
  });

  el.empresaDelGrupo.addEventListener('change', function () {
    cecoPreferido = null;
    cargarCentrosCosto(el.empresaDelGrupo.value);
  });

  el.tipoEquipo.addEventListener('change', function () {
    actualizarVisibilidadAnydesk();
  });

  el.tipoProblema.addEventListener('change', function () {
    actualizarAyudaTipoProblema(obtenerActivoPorId(el.activoSeleccionadoId.value));
    if (!el.slaModal.hidden) actualizarSlaModal();
    evaluarAperturaAutomaticaSla();
  });

  el.prioridad.addEventListener('change', function () {
    if (!el.slaModal.hidden) actualizarSlaModal();
    evaluarAperturaAutomaticaSla();
  });

  el.centroCosto.addEventListener('change', function () {
    actualizarCecoNumeroDesdeSeleccion();
  });

  el.activoGrid.addEventListener('click', function (event) {
    const card = event.target.closest('.activo-card');
    if (!card) return;
    seleccionarActivo(card.dataset.assetId);
  });

  el.btnVerSla.addEventListener('click', abrirSlaModal);

  el.btnCerrarSla.addEventListener('click', cerrarSlaModal);

  el.slaModal.addEventListener('click', function (event) {
    if (event.target === el.slaModal) cerrarSlaModal();
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && !el.slaModal.hidden) cerrarSlaModal();
  });

  el.btnBuscarDni.addEventListener('click', function () {
    sincronizarCamposNumericos();
    programarBusquedaDni({ forzar: true, mostrarErrorLongitud: true, delayMs: 80 });
  });

  function validarFrontend() {
    const correo = normalizarCorreo(el.correoElectronico.value);
    const requiereCorreo = !el.sinCorreoCorporativo.checked;
    const requeridos = [
      [normalizarDni(el.dni.value).length === dniLength, 'Ingresa un DNI valido (' + dniLength + ' digitos).'],
      [normalizarMovil(el.movil.value).length === movilLength, 'Ingresa un movil valido (' + movilLength + ' digitos).'],
      [!!el.nombreCompleto.value.trim(), 'Ingresa el nombre completo.'],
      [!!el.cargo.value.trim(), 'Ingresa el cargo.'],
      [!requiereCorreo || !!correo, 'Ingresa el correo electronico o activa "No cuento con correo corporativo".'],
      [!requiereCorreo || esCorreoValidoBasico(correo), 'Ingresa un correo electronico valido.'],
      [!requiereCorreo || esCorreoCorporativoPermitido(correo), 'El correo debe pertenecer a: ' + allowedEmailDomainsLabel + '.'],
      [!!el.proyectoSede.value.trim(), 'Ingresa el area o proyecto / sede.'],
      [!!el.empresaDelGrupo.value, 'No se pudo completar la empresa del trabajador desde el padron. Verifica el DNI o contacta a TIC.'],
      [!!el.centroCosto.value, 'No se pudo completar el centro de costo del trabajador desde el padron. Verifica el DNI o contacta a TIC.'],
      [!!el.activoSeleccionadoId.value.trim(), 'Selecciona uno de tus activos asignados, o usa Consulta u Otros.'],
      [!!el.tipoProblema.value, 'Selecciona el tipo de problema.'],
      [!!el.descripcion.value.trim(), 'Describe la incidencia.']
    ];

    const fallo = requeridos.find(function (regla) {
      return !regla[0];
    });

    return fallo ? fallo[1] : null;
  }

  el.btnEnviar.addEventListener('click', function () {
    sincronizarCamposNumericos();
    setTimeout(function () {
      sincronizarCamposNumericos();
      const errorFrontend = validarFrontend();
      if (errorFrontend) {
        toast(errorFrontend, 'error');
        return;
      }

      const payload = {
        dni: normalizarDni(el.dni.value),
        nombreCompleto: el.nombreCompleto.value,
        cargo: el.cargo.value,
        movil: normalizarMovil(el.movil.value),
        correoElectronico: normalizarCorreo(el.correoElectronico.value),
        sinCorreoCorporativo: !!el.sinCorreoCorporativo.checked,
        proyectoSede: el.proyectoSede.value,
        centroCosto: el.centroCosto.value,
        cecoNumero: el.cecoNumero.value,
        empresaDelGrupo: el.empresaDelGrupo.value,
        activoSeleccionadoId: el.activoSeleccionadoId.value,
        tipoEquipo: el.tipoEquipo.value,
        activoAfectado: el.activoAfectado.value,
        tipoProblema: el.tipoProblema.value,
        prioridad: el.prioridad.value,
        descripcion: el.descripcion.value,
        anydeskId: el.anydeskId.value,
        anydeskPassword: el.anydeskPassword.value
      };

      el.btnEnviar.disabled = true;
      loading(true);

      google.script.run
        .withSuccessHandler(function (res) {
          loading(false);
          el.btnEnviar.disabled = false;

          if (!res.ok) {
            toast(res.message, 'error');
            return;
          }

          el.ticketId.textContent = res.result.idRegistro;
          showView('view-ok');
        })
        .withFailureHandler(function () {
          loading(false);
          el.btnEnviar.disabled = false;
          toast('Error de comunicacion con el servidor.', 'error');
        })
        .ReporteService_crearReporte(payload);
    }, 180);
  });

  el.btnNuevoReporte.addEventListener('click', function () {
    document.querySelectorAll('#view-form input, #view-form textarea').forEach(function (campo) {
      campo.value = '';
    });

    document.querySelectorAll('#view-form select').forEach(function (campo) {
      campo.value = '';
    });

    el.sinCorreoCorporativo.checked = false;

    if (dniAutoBusquedaTimer) {
      clearTimeout(dniAutoBusquedaTimer);
      dniAutoBusquedaTimer = null;
    }
    dniConsultaSecuencia++;
    ultimoDniConsultado = '';
    dniEnConsulta = '';
    el.btnBuscarDni.disabled = false;
    el.btnBuscarDni.classList.remove('is-loading');
    el.centroCosto.disabled = true;
    llenarSelect(el.centroCosto, [], 'Selecciona primero la empresa...');
    el.cecoNumero.value = '';
    cecoPreferido = null;
    ultimaClaveSlaAutoMostrada = '';
    limpiarActivos('Ingresa tu DNI para cargar tus activos personales y compartidos de tu CECO.');
    actualizarVisibilidadAnydesk();
    actualizarEstadoCorreoCorporativo();
    el.dniAyuda.textContent = '';
    el.dniAyuda.className = 'ayuda';
    actualizarProgreso();
    showView('view-form');
  });

  cargarCatalogos();
  limpiarActivos('Ingresa tu DNI para cargar tus activos personales y compartidos de tu CECO.');
  actualizarVisibilidadAnydesk();
  actualizarEstadoCorreoCorporativo();
  actualizarProgreso();
})();
</script>
