<style>
  .portal-shell {
    width: 90%;
    max-width: 1040px;
    position: relative;
  }

  .portal-card {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, #ffffff 100%);
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid rgba(0, 74, 153, 0.08);
    box-shadow: 0 18px 60px rgba(28, 43, 74, 0.10);
  }

  .portal-hero {
    position: relative;
    padding: 34px 34px 28px;
    color: #fff;
    overflow: hidden;
    background:
      radial-gradient(circle at top right, rgba(255, 255, 255, 0.18), transparent 28%),
      linear-gradient(135deg, #0c376f 0%, #004a99 45%, #0f7b6d 100%);
  }

  .portal-hero::before,
  .portal-hero::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.16), transparent 70%);
    pointer-events: none;
  }

  .portal-hero::before {
    width: 320px;
    height: 320px;
    top: -140px;
    right: -60px;
    animation: heroFlota 9s ease-in-out infinite;
  }

  .portal-hero::after {
    width: 220px;
    height: 220px;
    bottom: -120px;
    left: 8%;
    background: radial-gradient(circle, rgba(22, 163, 74, 0.22), transparent 70%);
    animation: heroFlota 11s ease-in-out infinite reverse;
  }

  @keyframes heroFlota {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-18px, 16px) scale(1.06); }
  }

  .portal-hero > * { position: relative; z-index: 1; }

  .portal-kicker,
  .section-kicker {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;

  .portal-title {

    font-size: 32px;
    line-height: 1.08;
  }

  .action-card,

  .action-card {

    padding: 22px;

  .action-card:hover {

  .action-card:active { transform: translateY(-1px) scale(0.99); }

  .action-primary {

  .action-icon {

    justify-content: center;

    height: 42px;

    background: var(--c-app-bg);

  .action-go svg { transition: transform 0.18s ease; }

  .status-badge::before {

  .status-badge.is-progress::before { animation: pulso 1.4s ease-in-out infinite; }

  @keyframes pulso {
    0%, 100% { box-shadow: 0 0 0 0 currentColor; opacity: 1; }

  .btn-copy {

    transition: color 0.15s ease, border-color 0.15s ease, transform 0.12s ease;

  .status-timeline {

    margin: 22px 0 24px;
  }

  .timeline-step {

    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .timeline-step::before {
    content: '';
    position: absolute;
    top: 6px;
    left: -50%;
    width: 100%;
    height: 2px;
    background: var(--c-borde);
    z-index: 0;
  }

  .timeline-step:first-child::before { content: none; }

  .timeline-dot {
    position: relative;
    z-index: 1;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--c-borde);
    transition: background-color 0.25s ease, border-color 0.25s ease;
  }

  .timeline-label {
    margin-top: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--c-muted);
  }

  .timeline-step.is-done .timeline-dot { background: var(--c-secundario); border-color: var(--c-secundario); }
  .timeline-step.is-done::before { background: var(--c-secundario); }
  .timeline-step.is-current .timeline-dot { background: #fff; border-color: var(--c-primario); box-shadow: 0 0 0 4px rgba(0, 74, 153, 0.14); }
  .timeline-step.is-current .timeline-label { color: var(--c-primario); }
  .timeline-step.is-done .timeline-label { color: var(--c-texto); }

  .tracking-panel {

    padding: 18px;

  .admin-placeholder {
