<style>
  :root {
    --c-primario: <?= CONFIG.UI.COLOR_PRIMARIO ?>;
    --c-secundario: <?= CONFIG.UI.COLOR_SECUNDARIO ?>;
    --c-exito: <?= CONFIG.UI.COLOR_EXITO ?>;
    --c-error: <?= CONFIG.UI.COLOR_ERROR ?>;
    --c-alerta: <?= CONFIG.UI.COLOR_ALERTA ?>;
    --c-texto: <?= CONFIG.UI.COLOR_TEXTO ?>;
    --c-muted: <?= CONFIG.UI.COLOR_MUTED ?>;
    --c-borde: #dfe4ea;
    --c-surface: #ffffff;
    --c-app-bg: #eef2f7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 14px;
    color: var(--c-texto);
    background: linear-gradient(180deg, #fff 0%, var(--c-app-bg) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }

  a, button, input, select, textarea { font-family: inherit; }

  :focus-visible {
    outline: 2px solid var(--c-primario);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: var(--c-surface);
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(28, 43, 74, 0.10);
    overflow: hidden;
  }

  .hdr {
    background: var(--c-primario);
    color: #fff;
    padding: 20px 22px;
  }
  .hdr-titulo { font-size: 17px; font-weight: 700; }
  .hdr-sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  .logos img { max-height: 36px; margin-bottom: 8px; }

  .body { padding: 20px 22px 26px; }

  .view { display: none; }
  .view.active {
    display: block;
    animation: vistaEntra 0.38s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes vistaEntra {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .lbl {
    display: block;
    width: max-content;
    max-width: min(100%, 34ch);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .03em;
    text-transform: uppercase;
    text-align: left;
    line-height: 1.35;
    color: var(--c-muted);
    margin: 14px 0 6px;
  }

  .inp {
    width: 100%;
    padding: 11px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--c-texto);
    border: 1px solid var(--c-borde);
    border-radius: 8px;
    background: #fff;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.6s ease;
  }
  .inp:focus { border-color: var(--c-primario); box-shadow: 0 0 0 3px rgba(0, 74, 153, 0.12); }
  .inp.error { border-color: var(--c-error); box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.10); }
  .inp:disabled { background: #f2f4f7; color: var(--c-muted); }
  .inp.autocompletado { background-color: #eafaf1; animation: destello 1s ease; }
  @keyframes destello {
    0% { background-color: #d3f3e0; }
    100% { background-color: #eafaf1; }
  }

  .dni-row { display: flex; gap: 8px; }
  .dni-row .inp { flex: 1; }
  .btn-buscar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 16px;
    border: none;
    border-radius: 8px;
    background: var(--c-primario);
    color: #fff;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  .btn-buscar:hover:not(:disabled) { filter: brightness(1.08); box-shadow: 0 6px 16px rgba(0, 74, 153, 0.22); }
  .btn-buscar:active:not(:disabled) { transform: scale(0.97); }
  .btn-buscar:disabled { opacity: .6; cursor: default; }
  .btn-buscar .btn-spinner { display: none; }
  .btn-buscar.is-loading .btn-spinner { display: inline-block; }
  .btn-buscar.is-loading .btn-texto { display: none; }

  .btn-spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: girar 0.7s linear infinite;
  }

  .btn-main {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: var(--c-secundario);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  .btn-main:hover:not(:disabled) { filter: brightness(1.06); box-shadow: 0 10px 22px rgba(22, 163, 74, 0.28); transform: translateY(-1px); }
  .btn-main:active:not(:disabled) { transform: translateY(0) scale(0.98); }
  .btn-main:disabled { opacity: .6; cursor: default; }

  .btn-sec {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border: 1px solid var(--c-borde);
    border-radius: 9px;
    background: #fff;
    color: var(--c-primario);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease;
  }
  .btn-sec:hover { background: var(--c-app-bg); border-color: rgba(0, 74, 153, 0.24); }
  .btn-sec:active { transform: scale(0.98); }

  .check-wrap { text-align: center; padding: 18px 6px; }
  .check-circle {
    width: 64px; height: 64px; line-height: 64px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: var(--c-exito);
    color: #fff;
    font-size: 28px;
    box-shadow: 0 0 0 8px rgba(22, 163, 74, 0.12);
    animation: checkPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes checkPop {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); }
  }
  .check-title { font-size: 17px; font-weight: 700; }
  .check-sub { font-size: 13px; color: var(--c-muted); margin-top: 6px; }

  .alerta {
    font-size: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-top: 8px;
  }
  .alerta.alerta-warn { background: #fff7ed; color: var(--c-alerta); border: 1px solid #fde5c4; }
  .alerta.alerta-error { background: #fdecec; color: var(--c-error); border: 1px solid #f7c9c9; }
  .alerta.alerta-ok { background: #eafaf1; color: var(--c-exito); border: 1px solid #bfead1; }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(2px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    z-index: 30;
    font-size: 13px;
    color: var(--c-texto);
    animation: overlayEntra 0.15s ease;
  }
  @keyframes overlayEntra { from { opacity: 0; } to { opacity: 1; } }
  .spinner {
    width: 30px; height: 30px;
    border: 3px solid var(--c-borde);
    border-top-color: var(--c-primario);
    border-radius: 50%;
    animation: girar 0.8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translate(-50%, 20px) scale(0.96);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #1c2b4a;
    color: #fff;
    padding: 11px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 12px 28px rgba(15, 23, 42, 0.28);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 40;
    max-width: 90vw;
    text-align: left;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  #toast.toast-error { background: var(--c-error); }
  #toast.toast-ok { background: var(--c-exito); }
  #toast .toast-icon { flex: none; display: inline-flex; }
</style>
