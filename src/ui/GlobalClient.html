<script>
  function loading(on) {
    const overlay = document.getElementById('overlay');
    overlay.style.display = on ? 'flex' : 'none';
    overlay.setAttribute('aria-hidden', on ? 'false' : 'true');
  }

  function showView(id) {
    document.querySelectorAll('.view').forEach(function (el) {
      const activo = el.id === id;
      el.classList.remove('active');
      if (activo) {
        void el.offsetWidth;
        el.classList.add('active');
      }
    });

    const vista = document.getElementById(id);
    if (vista) vista.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  const TOAST_ICONOS = {
    error: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="rgba(255,255,255,0.2)"/><path d="M12 7v6M12 16.5v.01" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>',
    ok: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="rgba(255,255,255,0.2)"/><path d="M8 12.5l2.5 2.5L16 9.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="rgba(255,255,255,0.15)"/><path d="M12 10.5v6M12 7.5v.01" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>'
  };

  let toastTimeout;
  function toast(mensaje, tipo) {
    const el = document.getElementById('toast');
    const variante = tipo === 'error' ? 'error' : (tipo === 'ok' ? 'ok' : 'info');
    el.innerHTML = '<span class="toast-icon">' + TOAST_ICONOS[variante] + '</span><span>' + mensaje + '</span>';
    el.className = 'show toast-' + variante;
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(function () { el.className = ''; }, 4000);
  }
</script>
